services:
  backend:
    build:
      context: ./semAlign_backend
      dockerfile: Dockerfile
    container_name: semalign-backend
    restart: unless-stopped
    environment:
      APP_ENV: production
      DEBUG: "false"
      DATABASE_URL: sqlite:////app/data/semalign.db
      SECRET_KEY: ${SECRET_KEY:-change-me-to-a-long-random-secret-key-32chars}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:8080"]}
      UPLOAD_DIR: /app/data/uploads
      TEXT_OUTPUT_DIR: /app/data/texts
      IMAGE_OUTPUT_DIR: /app/data/images
      CHROMA_DB_DIR: /app/data/chroma_db
      BM25_INDEX_PATH: /app/data/bm25_chunks.pkl
      EMBEDDING_MODEL_DIR: /app/models/gte-multilingual-base
      FOURZ_API_KEY: ${FOURZ_API_KEY:-}
      FOURZ_API_BASE: ${FOURZ_API_BASE:-}
      FOURZ_API_MODEL: ${FOURZ_API_MODEL:-gpt-4o-mini}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_API_BASE: ${DEEPSEEK_API_BASE:-https://api.deepseek.com/v1}
      DEEPSEEK_API_MODEL: ${DEEPSEEK_API_MODEL:-deepseek-chat}
      ALIGNMENT_CHAT_MODE: ${ALIGNMENT_CHAT_MODE:-auto}
      SEARCH_RAG_ENABLED: ${SEARCH_RAG_ENABLED:-false}
      SEARCH_RAG_TOP_K: ${SEARCH_RAG_TOP_K:-5}
      RAG_ALGORITHM: ${RAG_ALGORITHM:-naive}
      # 嵌入模型已本地化（含 configuration.py/modeling.py），禁止运行时访问 HuggingFace
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
    volumes:
      - ./semAlign_backend/data:/app/data
      # 模型权重由 restore-runtime-data.sh 从 Git 历史解压到宿主机，再挂载进容器
      - ./semAlign_backend/models/gte-multilingual-base:/app/models/gte-multilingual-base:ro
      - ./semAlign_backend/models/models--sentence-transformers--all-MiniLM-L6-v2:/app/models/models--sentence-transformers--all-MiniLM-L6-v2:ro
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  frontend:
    build:
      context: ./semAlign
      dockerfile: Dockerfile
    container_name: semalign-frontend
    restart: unless-stopped
    ports:
      # 8080：原演示端口；80：兼容部分网络只放行标准 HTTP 端口
      - "${FRONTEND_PORT:-8080}:80"
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
