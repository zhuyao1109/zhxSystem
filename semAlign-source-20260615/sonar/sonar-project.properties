# SemAlign 项目 SonarQube 7.8 扫描配置
sonar.projectKey=semalign
sonar.projectName=SemAlign
sonar.projectVersion=1.0

# 仓库根目录（docker 扫描时挂载到 /usr/src）
sonar.sources=semAlign/src,semAlign_backend

# 排除第三方与生成物
sonar.exclusions=\
**/node_modules/**,\
**/.venv/**,\
**/dist/**,\
**/__pycache__/**,\
**/models/gte-multilingual-base/**,\
**/*.backup,\
**/tests/**,\
**/scripts/**

# 无前端单测与 OCR/深度学习模块时，不计入覆盖率门禁
sonar.coverage.exclusions=\
semAlign/src/**,\
**/services/conflict_detection/**,\
**/services/preprocessing/**,\
**/services/reporting/**,\
**/utils/pdf_parser.py,\
**/utils/rag.py,\
**/utils/validators.py,\
**/routers/standard_import.py,\
**/routers/search.py,\
**/services/conflict_pipeline/layer3_active_seek.py,\
**/services/conflict_pipeline/layer1_recall.py,\
**/scripts/**

# 语言指定（可选，自动检测亦可）
sonar.sourceEncoding=UTF-8

# Python 覆盖率（pytest --cov 生成 coverage.xml，路径须为相对路径供 Docker 扫描解析）
sonar.python.coverage.reportPaths=semAlign_backend/coverage.xml
sonar.python.version=3.12

# 前端 TypeScript：使用 Sonar 兼容的 tsconfig（避免 Vite 专有选项）
sonar.typescript.tsconfigPath=semAlign/tsconfig.sonar.json
